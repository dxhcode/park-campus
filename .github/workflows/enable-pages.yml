name: Enable GitHub Pages

on:
  push:
    branches:
      - cursor/park-frontend-scaffold-19b4
    paths:
      - .github/workflows/enable-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish dist branch as the Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          payload='{"build_type":"legacy","source":{"branch":"dist","path":"/"}}'
          if gh api "repos/${repo}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            gh api --method PUT "repos/${repo}/pages" --input - <<<"${payload}"
          else
            gh api --method POST "repos/${repo}/pages" --input - <<<"${payload}"
          fi
          gh api --method POST "repos/${repo}/pages/builds" || true
          gh api "repos/${repo}/pages"
