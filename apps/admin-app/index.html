<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>园区运营平台 · 管理控制台</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        try {
          var key = "park-campus-gh-path";
          var stored = sessionStorage.getItem(key);
          if (!stored) return;
          sessionStorage.removeItem(key);
          var base = "/park-campus/admin";
          if (stored !== base && stored.indexOf(base + "/") !== 0) return;
          var next = stored;
          if (next.length > base.length + 1 && next.endsWith("/")) next = next.slice(0, -1);
          if (next !== location.pathname) history.replaceState(null, "", next);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
