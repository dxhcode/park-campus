<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>园区运营平台</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #07111f;
        --cyan: #67e8f9;
        --gold: #f5c16c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
        color: #e8f1ff;
        background: radial-gradient(1200px 600px at 10% -10%, rgba(56, 189, 248, 0.28), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(245, 193, 108, 0.18), transparent 50%),
          var(--ink);
        overflow-x: hidden;
      }
      .grid {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(125, 211, 252, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(125, 211, 252, 0.08) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(circle at 50% 30%, #000 20%, transparent 78%);
        animation: drift 22s linear infinite;
        pointer-events: none;
      }
      @keyframes drift {
        to { background-position: 0 52px, 52px 0; }
      }
      main {
        position: relative;
        z-index: 1;
        max-width: 1080px;
        margin: 0 auto;
        padding: 72px 24px 48px;
      }
      .badge {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border: 1px solid rgba(103, 232, 249, 0.45);
        border-radius: 999px;
        color: var(--cyan);
        letter-spacing: 0.18em;
        font-size: 12px;
        background: rgba(8, 20, 38, 0.65);
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.18);
      }
      h1 {
        margin: 18px 0 8px;
        font-size: clamp(40px, 6vw, 68px);
        line-height: 1.05;
        letter-spacing: 0.04em;
      }
      h1 span {
        background: linear-gradient(90deg, #fff 10%, var(--cyan) 55%, var(--gold));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .lead { max-width: 640px; color: rgba(226, 232, 240, 0.78); font-size: 18px; line-height: 1.7; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 36px; }
      a.card {
        position: relative;
        display: block;
        padding: 28px 24px 24px;
        text-decoration: none;
        color: inherit;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(15, 32, 58, 0.82), rgba(7, 16, 32, 0.72));
        border: 1px solid rgba(148, 197, 255, 0.22);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 20px 60px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(16px);
        overflow: hidden;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }
      a.card:hover { transform: translateY(-4px); border-color: rgba(103, 232, 249, 0.7); }
      a.card::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        right: -50px;
        top: -70px;
        background: radial-gradient(circle, rgba(103, 232, 249, 0.45), transparent 68%);
      }
      a.card.gold::after { background: radial-gradient(circle, rgba(245, 193, 108, 0.5), transparent 68%); }
      .kicker { color: var(--cyan); font-size: 12px; letter-spacing: 0.22em; }
      a.card.gold .kicker { color: var(--gold); }
      h2 { margin: 10px 0 8px; font-size: 28px; }
      p { margin: 0; color: rgba(226, 232, 240, 0.74); line-height: 1.7; }
      .go { display: inline-block; margin-top: 18px; color: white; letter-spacing: 0.08em; }
      footer { margin-top: 42px; color: rgba(148, 163, 184, 0.85); font-size: 13px; }
      @media (prefers-reduced-motion: reduce) { .grid { animation: none; } }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <main>
      <div class="badge">ULSP · PARK CAMPUS</div>
      <h1><span>园区运营平台</span></h1>
      <p class="lead">管理控制台已接通演示登录、报修缴费和其余台账。态势大屏可在滨江云栖、临港智造、光谷生命科学三园之间切换驾驶舱，也能从后台跳入再返回。</p>
      <div class="cards">
        <a class="card" href="./admin/">
          <div class="kicker">ADMIN</div>
          <h2>管理控制台</h2>
          <p>深色侧栏后台。报修、缴费和其余台账可在浏览器里增删改，工作台可以跳进对应大屏。</p>
          <span class="go">进入管理端 →</span>
        </a>
        <a class="card gold" href="./screen/">
          <div class="kicker">SCREEN</div>
          <h2>态势大屏</h2>
          <p>全屏科技风指挥舱。地图、图表和滚动指标按场景切换，三座虚构园区的电话和金额仅供演示。</p>
          <span class="go">进入大屏 →</span>
        </a>
      </div>
      <footer>演示账号 admin / park2026 · 无后端接口</footer>
    </main>
  </body>
</html>
